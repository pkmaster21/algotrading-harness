[project]
name = "algotrading-harness"
version = "0.1.0"
description = "Backtest-first algorithmic trading harness with a protected risk layer"
readme = "README.md"
authors = [
    { name = "David Zhao" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.45.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
