# ~100 US large-cap stocks (roughly the S&P 100 as of 2025), no ETFs.
# Survivorship-biased: today's members applied to all history, so names that fell out
# (or were acquired or delisted) are missing and backtests look better than reality.
# Good for developing cross-sectional strategies; not evidence of an edge until it is
# replaced by point-in-time index membership (ARCHITECTURE.md, Universe decision).
# Names that listed after the data start (UBER 2019, PLTR 2020) have no bars before
# their first session.
